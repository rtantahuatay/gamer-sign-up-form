<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NEONCORE - Join the Nexus</title>
        <link rel="icon" type="image/png" href="./assets/images/favicon-32x32.png" >
        <link rel="stylesheet" href="./css/styles.css">
        <script src="./js/main.js" defer></script>
        
    </head>

    <body>
        <main class="layout">

            <section class="brand">
                <img class="brand__logo" src="./assets/images/logo.svg" alt="NEONCORE" width="169" height="32">
                <h1 class="brand__title">
                    <span class="brand__slashes" aria-hidden="true">//</span>
                    Join the nexus
                </h1>
                <p class="brand__subtitle">Initialize your NEONCORE identity</p>
            </section>

            <section class="signup">
                <form class="form" novalidate>
                    <div class="form__header">
                        <h2 class="form__title">New Operator</h2>
                        <p class="form__required">All fields required</p>
                    </div>
                    <div class="field">
                        <label class="field__label" for="callsign">
                            <span class="field__prompt" aria-hidden="true" >&gt;</span>
                            Callsign
                        </label>
                        <input class="field__input" type="text" id="callsign" name="callsign" placeholder="e.g. Vortex_07"
                        autocomplete="username" required aria-describedby="callsign-message">

                        <p class="field__message" id="callsign-message">3-20 characters: letters, numbers, _ or -</p>
                    </div>

                    <div class="field">
                        <label class="field__label" for="email">
                            <span class="field__prompt" aria-hidden="true">&gt;</span>
                            Email
                        </label>
                        <input class="field__input" type="email" id="email" name="email" placeholder="you@example.com"
                        autocomplete="email" required aria-describedby="email-message">
                        <p class="field__message" id="email-message"></p>
                    </div>

                    <div class="field">
                        <label class="field__label" for="password">
                            <span class="field__prompt" aria-hidden="true">&gt;</span>
                            Password
                        </label>

                        <div class="field__control">
                            <input class="field__input" type="password" id="password" name="password"
                            autocomplete="new-password" required aria-describedby="password-message password-strength">

                            <button class="field__toggle" type="button" aria-label="Show password" aria-pressed="false" aria-controls="password">
                                <img src="./assets/images/icon-eye.svg" alt="" width="20" height="20">
                            </button>
                        </div>

                        <div class="strength" aria-hidden="true">
                            <span class="strength__bar"></span>
                            <span class="strength__bar"></span>
                            <span class="strength__bar"></span>
                            <span class="strength__bar"></span>
                        </div>


                        <div class="field__footer">
                            <p class="field__message" id="password-message">At least 8 characters</p>
                            <p class="strength__label" id="password-strength" aria-live="polite"></p>
                        </div>
                    </div>

                    <div class="field">
                        <label class="field__label" for="confirm-password">
                            <span class="field__prompt" aria-hidden="true">&gt;</span>
                            Confirm password
                        </label>

                        <div class="field__control">
                            <input class="field__input" type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" 
                            required aria-describedby="confirm-password-message">
                            <button class="field__toggle" type="button" aria-label="Show password confirmation" aria-pressed="false"
                            aria-controls="confirm-password">
                                <img src="./assets/images/icon-eye.svg" alt="" width="20" height="20">
                            </button>
                        </div>
                        <p class="field__message" id="confirm-password-message"></p>
                    </div>

                    <div class="field">
                        <div class="checkbox">
                            <input class="checkbox__input" type="checkbox" id="terms" name="terms" required aria-describedby="terms-message">
                            <label class="checkbox__label" for="terms">
                                I accept the <a class="link" href="#">Terms</a> and <a class="link" href="#">Privacy Policy</a>.
                            </label> 
                        </div>
                        <p class="field__message" id="terms-message"></p>
                    </div>

                    <button class="form__submit" type="submit">Initialize account</button>
                    <p class="form__status" id="form-status" role="status"></p>


                </form>

                <p class="signup__login">
                    Already an operator? <a class="link" href="#">Log in</a>
                </p>

            </section>
        </main>
    </body>
</html>
